<style>

  header .header-top { display: grid; grid-template-columns: 78px 1fr 78px; align-items: center; gap: 8px; margin-bottom: 5px; }

  header .firma-header { grid-column: 1; grid-row: 1; justify-self: start; width: 78px; height: 46px; }
  header .cart-toggle { grid-column: 3; grid-row: 1; justify-self: end; position: relative; width: 46px; height: 46px; padding: 0; border: none; background: transparent; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background .15s ease; }
  header .cart-toggle:hover { background: rgba(246,241,233,.14); }
  header .cart-toggle svg { width: 30px; height: 30px; transition: transform .15s ease; }
  header .cart-toggle:hover svg { transform: scale(1.1); }
  .cart-badge { position: absolute; top: -3px; right: -3px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 10px; background: var(--vino); color: var(--lino); font-family: 'Mulish', sans-serif; font-size: .66rem; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  @keyframes popPunch { 0% { transform: scale(1); } 35% { transform: scale(1.32); } 60% { transform: scale(.94); } 100% { transform: scale(1); } }
  .pop { animation: popPunch .4s cubic-bezier(.34,1.56,.64,1); }
  @keyframes rowFlash { 0% { background-color: #F1DEE2; } 100% { background-color: transparent; } }
  .item.flash { animation: rowFlash .7s ease-out; }
  .cart-row.flash { animation: rowFlash .7s ease-out; border-radius: 4px; }
  header .sub { text-align: center; font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: .82rem; color: var(--humo-claro); margin-bottom: 14px; }
  .sello-flotante-wrap { position: fixed; right: 14px; bottom: 14px; z-index: 20; display: flex; flex-direction: column; align-items: center; text-decoration: none; }
  .sello-flotante-wrap .sello-caption-arc { order: 1; display: block; width: 320px; height: auto; margin-bottom: -42px; pointer-events: none; }
  .sello-flotante-wrap .sello-caption-mobile { display: none; }
  .sello-flotante { order: 2; display: block; width: 224px; height: 224px; transform: rotate(-8deg); filter: drop-shadow(0 3px 6px rgba(20,17,14,.35)); transition: transform .18s ease; }
  .sello-flotante-wrap:hover .sello-flotante { transform: rotate(-8deg) scale(1.08); }
  @media (max-width: 420px) {
    body { padding-bottom: 98px; }

    header .firma-header { width: 44px; height: 38px; }
    header .cart-toggle { width: 38px; height: 38px; }
    header .cart-toggle svg { width: 26px; height: 26px; }
    header .wordmark { font-size: .8rem; letter-spacing: .09em; }
    .sello-flotante-wrap {
      left: 0; right: 0; bottom: 0; top: auto;
      width: 100%; height: 86px;
      flex-direction: row; align-items: center; justify-content: center; gap: 12px;
      background: var(--lino); border-top: 1px solid var(--borde); box-shadow: 0 -3px 10px rgba(20,17,14,.18);
    }
    .sello-flotante-wrap .sello-caption-arc { display: none; }
    .sello-flotante-wrap .sello-caption-mobile { display: block; order: 2; font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: .95rem; line-height: 1.15; color: var(--vino); max-width: 160px; }
    .sello-flotante { order: 1; width: 58px; height: 58px; margin: 0; }
    .sello-flotante-wrap:hover .sello-flotante { transform: rotate(-8deg); }

  header input { width: 100%; padding: 12px 15px; border: 1px solid transparent; border-radius: 3px; font-family: 'Mulish', sans-serif; font-size: .95rem; background: var(--lino); color: var(--tinta); }

  .cart-overlay { position: fixed; inset: 0; z-index: 50; background: rgba(20,17,14,.55); display: flex; align-items: center; justify-content: center; padding: 16px; }

  .cart-panel { width: 100%; max-width: 440px; max-height: 84vh; display: flex; flex-direction: column; background: var(--lino); border-radius: 6px; box-shadow: 0 12px 40px rgba(20,17,14,.4); }

  .cart-close { background: none; border: none; font-size: 1.4rem; line-height: 1; color: var(--humo); cursor: pointer; padding: 4px; }
  .cart-items { overflow-y: auto; padding: 6px 18px; flex: 1; }
  .cart-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--borde); }

  .cart-row-info { flex: 1; min-width: 0; }
  .cart-row-name { font-family: 'Mulish', sans-serif; font-weight: 700; font-size: .84rem; color: var(--tinta); }
  .cart-row-brand { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: .76rem; color: var(--humo); }

  .cart-summary { padding: 12px 18px 4px; border-top: 1px solid var(--borde); font-family: 'Mulish', sans-serif; font-size: .85rem; }
  .cart-summary-row { display: flex; justify-content: space-between; margin-bottom: 6px; color: var(--tinta); }

  .btn-wa { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 12px 18px 18px; padding: 12px; border-radius: 4px; background: #25D366; color: #fff; font-family: 'Mulish', sans-serif; font-weight: 800; font-size: .88rem; text-decoration: none; }

</style>

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtPrice(n) { return '$ ' + Math.round(n).toLocaleString('es-AR'); }

// ── Carrito ──
var DATA_BY_KEY = {};
DATA.forEach(function(d) { DATA_BY_KEY[d.brand + '||' + d.name] = d; });
var CART_STORAGE_KEY = 'catalogo-cart';
var CART_DESCUENTO_POR_UNIDAD_EXTRA = 10000;
var cart = {};
(function loadCart() {
  try {
    var saved = JSON.parse(localStorage.getItem(CART_STORAGE_KEY) || '{}');
    Object.keys(saved).forEach(function(k) {
      var d = DATA_BY_KEY[k];
      if (d && saved[k] && saved[k].qty > 0) cart[k] = { brand: d.brand, name: d.name, price: d.price, qty: saved[k].qty };
    });
  } catch (e) {}
})();

function saveCart() { localStorage.setItem(CART_STORAGE_KEY, JSON.stringify(cart)); }
function cartCount() { return Object.keys(cart).reduce(function(s, k) { return s + cart[k].qty; }, 0); }
function cartTotals() {
  var gross = 0, units = 0;
  Object.keys(cart).forEach(function(k) { gross += cart[k].price * cart[k].qty; units += cart[k].qty; });
  var descuento = units > 0 ? CART_DESCUENTO_POR_UNIDAD_EXTRA * Math.max(units - 1, 0) : 0;
  return { gross: gross, units: units, descuento: descuento, total: gross - descuento };
}

function qtyCtrlHtml(key) {
  var qty = cart[key] ? cart[key].qty : 0;
  if (qty > 0) {
    return '<div class="qty-ctrl"><button type="button" class="qty-btn" data-action="dec" data-key="' + esc(key) + '">−</button>' +
      '<span class="qty-num">' + qty + '</span>' +
      '<button type="button" class="qty-btn" data-action="inc" data-key="' + esc(key) + '">+</button></div>';
  }
  return '<div class="qty-ctrl"><button type="button" class="add-btn" data-action="add" data-key="' + esc(key) + '">+ Agregar</button></div>';
}

function handleCartAction(action, key) {
  if (!action || !key) return;
  if (action === 'add') {
    var d = DATA_BY_KEY[key];
    if (!d) return;
    if (!cart[key]) cart[key] = { brand: d.brand, name: d.name, price: d.price, qty: 0 };
    cart[key].qty++;
  } else if (action === 'inc') {
    if (cart[key]) cart[key].qty++;
  } else if (action === 'dec' || action === 'remove') {
    if (cart[key]) {
      cart[key].qty = action === 'remove' ? 0 : cart[key].qty - 1;
      if (cart[key].qty <= 0) delete cart[key];
    }
  }
  saveCart();
  renderCartBadge();
  renderCartPanel();
  render(document.getElementById('q').value);
  if (action === 'add' || action === 'inc') {
    triggerPop(document.getElementById('cartToggle'));
    triggerPop(document.getElementById('cartBadge'));
    triggerFlash(document.querySelector('.item[data-key="' + CSS.escape(key) + '"]'));
    triggerFlash(document.querySelector('.cart-row[data-key="' + CSS.escape(key) + '"]'));
  }
}

function triggerPop(el) {
  if (!el) return;
  el.classList.remove('pop');
  void el.offsetWidth;
  el.classList.add('pop');
}
function triggerFlash(el) {
  if (!el) return;
  el.classList.remove('flash');
  void el.offsetWidth;
  el.classList.add('flash');
}

function renderCartBadge() {
  var badge = document.getElementById('cartBadge');
  var n = cartCount();
  if (n > 0) { badge.textContent = n; badge.hidden = false; } else { badge.hidden = true; }
}

function renderCartPanel() {
  var itemsEl = document.getElementById('cartItems');
  var keys = Object.keys(cart);
  if (keys.length === 0) {
    itemsEl.innerHTML = '<div class="cart-empty">Todavía no agregaste ninguna fragancia.</div>';
  } else {
    itemsEl.innerHTML = keys.map(function(k) {
      var it = cart[k];
      return '<div class="cart-row" data-key="' + esc(k) + '">' +
        '<div class="cart-row-info"><div class="cart-row-name">' + esc(it.name) + '</div><div class="cart-row-brand">' + esc(it.brand) + '</div></div>' +
        '<div class="qty-ctrl"><button type="button" class="qty-btn" data-action="dec" data-key="' + esc(k) + '">−</button>' +
        '<span class="qty-num">' + it.qty + '</span>' +
        '<button type="button" class="qty-btn" data-action="inc" data-key="' + esc(k) + '">+</button></div>' +
        '<span class="cart-row-price">' + fmtPrice(it.price * it.qty) + '</span>' +
        '</div>';
    }).join('');
  }
  var t = cartTotals();
  document.getElementById('cartSubtotal').textContent = fmtPrice(t.gross);
  document.getElementById('cartDescuento').textContent = t.descuento > 0 ? '−' + fmtPrice(t.descuento) : fmtPrice(0);
  document.getElementById('cartTotal').textContent = fmtPrice(t.total);
  var waBtn = document.getElementById('cartWhatsapp');
  if (keys.length === 0) {
    waBtn.setAttribute('aria-disabled', 'true');
    waBtn.removeAttribute('href');
  } else {
    waBtn.removeAttribute('aria-disabled');
    waBtn.href = buildWhatsappUrl();
  }
}

function buildWhatsappUrl() {
  var keys = Object.keys(cart);
  var lines = keys.map(function(k) {
    var it = cart[k];
    return '• ' + it.qty + 'x ' + it.name + ' (' + it.brand + ') — ' + fmtPrice(it.price * it.qty);
  });
  var t = cartTotals();
  var msg = '¡Hola! Quiero encargar estas fragancias:\n\n' + lines.join('\n') +
    '\n\nSubtotal: ' + fmtPrice(t.gross) +
    (t.descuento > 0 ? '\nDescuento envío combinado: −' + fmtPrice(t.descuento) : '') +
    '\nTotal: ' + fmtPrice(t.total);
  return 'https://wa.me/5493516199682?text=' + encodeURIComponent(msg);
}

function openCart() { renderCartPanel(); document.getElementById('cartOverlay').hidden = false; }
function closeCart() { document.getElementById('cartOverlay').hidden = true; }

document.getElementById('cartToggle').addEventListener('click', openCart);
document.getElementById('cartClose').addEventListener('click', closeCart);
document.getElementById('cartOverlay').addEventListener('click', function(e) { if (e.target.id === 'cartOverlay') closeCart(); });
document.getElementById('cartItems').addEventListener('click', function(e) {
  var btn = e.target.closest('[data-action]');
  if (btn) handleCartAction(btn.getAttribute('data-action'), btn.getAttribute('data-key'));
});
document.getElementById('results').addEventListener('click', function(e) {
  var btn = e.target.closest('[data-action]');
  if (btn) handleCartAction(btn.getAttribute('data-action'), btn.getAttribute('data-key'));
});

function render(query) {
  var q = query.trim().toLowerCase();
  var filtered = q ? DATA.filter(function(d) {
    return d.brand.toLowerCase().indexOf(q) !== -1 || d.name.toLowerCase().indexOf(q) !== -1;
  }) : DATA;
  var groups = {};
  filtered.forEach(function(d) { (groups[d.brand] = groups[d.brand] || []).push(d); });
  var brands = Object.keys(groups).sort(function(a, b) { return a.localeCompare(b); });
  document.getElementById('count').textContent = q ? (filtered.length + ' resultado' + (filtered.length !== 1 ? 's' : '')) : '';
  var out = '';
  if (brands.length === 0) {
    out = '<div class="empty">No se encontraron productos.</div>';
  } else {
    brands.forEach(function(b) {
      out += '<div class="brand-group"><div class="brand-title">' + esc(b) + '</div>';
      groups[b].forEach(function(d) {
        var key = d.brand + '||' + d.name;
        out += '<div class="item" data-key="' + esc(key) + '"><span class="name">' + esc(d.name) + '</span>' +
          '<div class="item-right"><span class="price">' + fmtPrice(d.price) + '</span>' + qtyCtrlHtml(key) + '</div></div>';
      });
      out += '</div>';
    });
  }
  document.getElementById('results').innerHTML = out;
}
document.getElementById('q').addEventListener('input', function(e) { render(e.target.value); });
render('');
renderCartBadge();
renderCartPanel();
</script>
</body>
