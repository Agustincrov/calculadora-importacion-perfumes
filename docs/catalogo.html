<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Encargos · Crovato Fragrances</title>
<meta name="description" content="Perfumes originales por encargo. Armá tu pedido y mandámelo por WhatsApp.">
<meta property="og:title" content="Encargos de perfumes originales · Crovato Fragrances">
<meta property="og:description" content="Perfumes de diseñador, nicho y árabes. Pedidos hasta el jueves, cierre el viernes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Mulish:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap">
<style>
/* Tokens y componentes compartidos (design system "D1 · La Firma"). Tema único claro, a propósito: es la marca. */
:root {
  --lino: #f6f1e9;
  --tinta: #14110e;
  --vino: #6e2a39;
  --humo: #8a8378;          /* solo texto grande */
  --meta: #6b6459;          /* texto chico secundario */
  --borde-marco: #e6ddcd;
  --borde-card: #ece3d4;
  --tinte: #f6ede9;
  --blanco: #ffffff;
  --piedra: #d6d3d1;
  --piedra-claro: #e7e5e4;
  --ink-500: #57534e;
  --footer: #fbf8f3;
  --ok-bg: #f0fdf4; --ok: #15803d; --ok-borde: #16a34a;
  --wa: #25d366;            /* texto tinta encima: 9,49:1 (desvío aprobado del .btn-wa) */
  --chrome-dark: linear-gradient(176deg,#3a3f43 0%,#5b6469 16%,#8d979e 32%,#b3bcc1 44%,#6b7479 56%,#2f3438 70%,#545d62 86%,#3a3f43 100%);
  --rule: linear-gradient(90deg,#9aa4ab,#eef3f6,#9aa4ab);
  --f-display: 'Cinzel', 'Times New Roman', serif;
  --f-serif: 'Cormorant Garamond', Georgia, serif;
  --f-sans: 'Mulish', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'Space Mono', ui-monospace, Menlo, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font-variant-numeric: lining-nums; background: var(--lino); color: var(--tinta); font-family: var(--f-sans); font-size: 15px; line-height: 1.45; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--vino); }
:focus-visible { outline: 2px solid var(--vino); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ic { width: 22px; height: 22px; flex: none; }
.tnum { font-variant-numeric: tabular-nums; }

.wordmark { font-family: var(--f-display); font-weight: 500; text-transform: uppercase; letter-spacing: .16em; background: var(--chrome-dark); -webkit-background-clip: text; background-clip: text; color: transparent; white-space: nowrap; }
.chrome-rule { width: 24px; height: 2px; border-radius: 1px; background: var(--chrome-dark); }
.eyebrow { margin: 0; font-family: var(--f-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--vino); }

/* Botones */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid transparent; font-weight: 600; font-size: 15px; text-decoration: none; transition: transform .12s ease, background-color .15s ease, border-color .15s ease; }
.btn:active { transform: scale(.98); }
.btn-primary { background: var(--vino); color: var(--tinte); }
.btn-primary:hover { background: #5c2230; }
.btn-outline { background: var(--blanco); border-color: var(--piedra); color: var(--tinta); }
.btn-outline:hover { border-color: var(--tinta); }
.btn-wa { background: var(--wa); color: var(--tinta); font-weight: 700; }
.btn-wa:hover { background: #20bd5a; }
.btn-wa[aria-disabled="true"] { opacity: .5; pointer-events: none; }
.btn-block { width: 100%; }
.btn-link { background: none; border: 0; padding: 0; min-height: 44px; color: var(--vino); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
.icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 999px; border: 0; background: transparent; color: var(--tinta); position: relative; }
.icon-btn:hover { background: rgba(20,17,14,.06); }

/* Badge del carrito */
.badge { position: absolute; top: 4px; right: 2px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 999px; background: var(--vino); color: #fff; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
.badge[hidden] { display: none; }
@keyframes pop { 0% { transform: scale(.6); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
.badge.pop { animation: pop .3s ease; }

/* Tags (tinte, Space Mono) */
.tag { display: inline-flex; align-items: center; min-height: 22px; padding: 2px 8px; border-radius: 999px; background: var(--tinte); border: 1px solid rgba(110,42,57,.25); color: var(--vino); font-family: var(--f-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; line-height: 1.2; white-space: nowrap; }
.tag-btn { position: relative; cursor: pointer; min-height: 30px; padding: 4px 10px; }
.tag-btn::after { content: ""; position: absolute; inset: -7px -4px; }   /* área táctil de 44 px; con 14 px entre filas de chips las áreas no se pisan */
.tag-btn:hover { background: #efdcd6; }
.tag-plain { background: transparent; border-color: var(--borde-marco); color: var(--meta); }
.spec { font-family: var(--f-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--meta); }
.cond-line { margin: 2px 0 0; font-size: 12.5px; color: var(--meta); }

/* Selector de cantidad (44 px) */
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--piedra); border-radius: 999px; background: var(--blanco); height: 44px; }
.stepper button { width: 44px; height: 42px; border: 0; background: transparent; display: inline-flex; align-items: center; justify-content: center; border-radius: 999px; color: var(--tinta); }
.stepper button:hover { background: var(--lino); }
.stepper .ic { width: 18px; height: 18px; }
.stepper output { min-width: 26px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }

/* Chips de filtro */
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--piedra); background: var(--blanco); font-size: 14px; font-weight: 500; white-space: nowrap; color: var(--tinta); }
.chip[aria-pressed="true"], .chip.is-active { border-color: var(--vino); background: rgba(110,42,57,.08); color: var(--vino); font-weight: 600; }
.chip .n { font-family: var(--f-mono); font-size: 11px; color: var(--meta); }
.chip[aria-pressed="true"] .n { color: var(--vino); }
.chip-x .ic { width: 16px; height: 16px; }

/* Buscador */
.search { position: relative; }
.search .ic { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--meta); width: 20px; height: 20px; pointer-events: none; }
.search input { width: 100%; height: 48px; padding: 0 44px 0 44px; border-radius: 999px; border: 1px solid var(--piedra); background: var(--blanco); font-size: 16px; }
.search input::placeholder { color: var(--meta); }
.search input:focus { outline: none; border-color: var(--tinta); box-shadow: 0 0 0 3px rgba(110,42,57,.15); }
.search input::-webkit-search-cancel-button { display: none; }
.search .clear { position: absolute; right: 2px; top: 50%; transform: translateY(-50%); }
.search .clear .ic { position: static; transform: none; color: var(--tinta); width: 18px; height: 18px; }

/* Botón agregar y estado agregado */
.add { min-height: 44px; padding: 0 16px; border: 0; border-radius: 10px; background: var(--vino); color: var(--tinte); font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.add:hover { background: #5c2230; }
.add:active { transform: scale(.98); }
.added-flash { animation: addedFlash 1.4s ease; }
@keyframes addedFlash { 0%, 70% { box-shadow: 0 0 0 2px var(--ok-borde); } 100% { box-shadow: 0 0 0 0 transparent; } }

/* Diálogos: drawer lateral y hoja de explicación */
.overlay { position: fixed; inset: 0; z-index: 50; background: rgba(20,17,14,.4); }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; z-index: 51; width: 100%; max-width: 448px; height: 100dvh; background: var(--blanco); display: flex; flex-direction: column; box-shadow: 0 20px 40px rgba(20,17,14,.25); transform: translateX(100%); transition: transform .25s ease; }
.drawer.is-open { transform: none; }
.drawer-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 8px 8px 20px; border-bottom: 1px solid var(--piedra-claro); }
.drawer-head h2 { margin: 0; font-family: var(--f-serif); font-weight: 500; font-size: 24px; }
.drawer-head h2 .n { color: var(--meta); font-family: var(--f-sans); font-size: 15px; font-weight: 500; }
.drawer-body { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 4px 20px 16px; }
.drawer-foot { border-top: 1px solid var(--piedra-claro); padding: 14px 20px calc(14px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 10px; background: var(--blanco); }

.sheet { position: fixed; inset: 0; z-index: 60; background: rgba(20,17,14,.4); display: flex; align-items: flex-end; justify-content: center; }
.sheet-card { width: 100%; max-width: 520px; background: var(--blanco); border-radius: 20px 20px 0 0; padding: 10px 22px calc(20px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 10px; max-height: 88dvh; overflow-y: auto; }
.sheet-grip { width: 40px; height: 4px; border-radius: 2px; background: var(--piedra); margin: 0 auto 8px; }
.sheet-title { margin: 0; font-family: var(--f-serif); font-weight: 500; font-size: 26px; line-height: 1.15; }
.sheet-body p { margin: 0 0 10px; font-size: 15.5px; line-height: 1.55; }
.sheet-actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
@media (min-width: 720px) { .sheet { align-items: center; } .sheet-card { border-radius: 16px; padding: 24px 28px; } .sheet-grip { display: none; } }

/* Formulario */
.field { display: grid; gap: 6px; }
.field > label, .field > .label { font-size: 12px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-500); }
.field input, .field select { height: 48px; border-radius: 12px; border: 1px solid var(--piedra); background: var(--blanco); padding: 0 14px; font-size: 16px; width: 100%; }
.field input:focus, .field select:focus { outline: none; border-color: var(--tinta); box-shadow: 0 0 0 3px rgba(110,42,57,.15); }
.field .err { font-size: 13px; color: #b91c1c; }
.field.invalid input, .field.invalid select { border-color: #f87171; }
.opts { display: grid; gap: 8px; }
.opt { display: grid; grid-template-columns: 22px 1fr auto; align-items: center; gap: 10px; min-height: 52px; padding: 8px 14px; border: 1px solid var(--piedra); border-radius: 12px; background: var(--blanco); cursor: pointer; font-size: 14.5px; }
.opt input { width: 18px; height: 18px; accent-color: var(--vino); margin: 0; }
.opt:has(input:checked) { border-color: var(--vino); background: rgba(110,42,57,.05); }
.opt small { display: block; color: var(--meta); font-size: 12.5px; }
.opt b { font-variant-numeric: tabular-nums; }

/* Filas del carrito */
.cart-line { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; padding: 14px 0; border-bottom: 1px solid var(--piedra-claro); }
.cart-line .brand { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--vino); }
.cart-line .name { font-variant-numeric: lining-nums; font-family: var(--f-serif); font-size: 19px; line-height: 1.15; }
.cart-line .price { font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
.cart-line .row2 { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.sum-row { display: flex; justify-content: space-between; gap: 12px; font-size: 14.5px; }
.sum-row.total { font-size: 18px; font-weight: 700; }
.sum-row .muted, .muted { color: var(--meta); }
.trust { display: flex; align-items: center; gap: 10px; font-family: var(--f-serif); font-style: italic; font-size: 16px; color: var(--tinta); }
.empty-cart { display: grid; justify-items: center; text-align: center; gap: 12px; padding: 36px 8px; }
.empty-cart p { margin: 0; font-family: var(--f-serif); font-size: 22px; }

/* Vacíos y avisos */
.no-results { display: grid; gap: 12px; justify-items: start; padding: 28px 4px; }
.no-results h3 { margin: 0; font-family: var(--f-serif); font-weight: 500; font-size: 24px; }
.no-results p { margin: 0; color: var(--meta); }
.corrected { font-size: 14px; color: var(--meta); padding: 6px 0; }
.corrected b { color: var(--tinta); }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; scroll-behavior: auto !important; } }

/* Partes del carrito */
.cart-note { display: flex; gap: 10px; align-items: flex-start; margin: 14px 0 4px; padding: 12px 14px; border-radius: 12px; background: var(--lino); font-size: 13.5px; line-height: 1.45; }
.cart-note .ic { color: var(--vino); width: 20px; height: 20px; margin-top: 1px; }
.steps { list-style: none; margin: 0; padding: 10px 20px; display: flex; gap: 18px; border-bottom: 1px solid var(--piedra-claro); font-size: 13px; color: var(--meta); }
.steps li { display: flex; align-items: center; gap: 6px; }
.steps li span { width: 22px; height: 22px; border-radius: 999px; border: 1px solid var(--piedra); display: inline-flex; align-items: center; justify-content: center; font-family: var(--f-mono); font-size: 11px; }
.steps li[aria-current="step"] { color: var(--vino); font-weight: 600; }
.steps li[aria-current="step"] span { border-color: var(--vino); background: var(--vino); color: var(--tinte); }
.cart-sub { margin: 22px 0 10px; font-family: var(--f-serif); font-weight: 500; font-size: 22px; }
.checkout { display: grid; gap: 16px; padding-top: 14px; }
.clear-row { padding-top: 6px; }
.wa-note { margin: 0; font-size: 12.5px; color: var(--meta); text-align: center; }
.letter { margin: 0; white-space: pre-wrap; word-break: break-word; font-family: var(--f-sans); font-size: 14px; line-height: 1.55; background: #faf5ec; border: 1px solid var(--borde-marco); border-radius: 12px; padding: 16px; }
.drawer-head h2 { flex: 1; }

/* Panel de filtros */
.fp-card { max-width: 560px; padding-bottom: 0; grid-template-rows: auto auto 1fr auto; }
.fp-head { display: flex; align-items: center; justify-content: space-between; }
.fp-body { overflow-y: auto; display: grid; gap: 18px; padding-bottom: 12px; }
.fp-group { border: 0; margin: 0; padding: 0; display: grid; gap: 10px; }
.fp-group legend { padding: 0 0 8px; font-family: var(--f-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--vino); }
.fp-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.fp-chips .chip { cursor: pointer; }
.fp-chips .chip:has(input:focus-visible) { outline: 2px solid var(--vino); outline-offset: 2px; }
.fp-search input { height: 44px; }
.fp-brands { max-height: 260px; overflow-y: auto; border: 1px solid var(--piedra-claro); border-radius: 12px; }
.fp-brand { display: grid; grid-template-columns: 22px 1fr auto; align-items: center; gap: 10px; min-height: 44px; padding: 0 14px; border-bottom: 1px solid var(--piedra-claro); cursor: pointer; font-size: 14.5px; }
.fp-brand:last-child { border-bottom: 0; }
.fp-brand input { width: 18px; height: 18px; accent-color: var(--vino); margin: 0; }
.fp-brand .n { font-family: var(--f-mono); font-size: 11px; color: var(--meta); }
.fp-foot { position: sticky; bottom: 0; display: flex; gap: 10px; padding: 12px 0 calc(14px + env(safe-area-inset-bottom, 0px)); background: var(--blanco); border-top: 1px solid var(--piedra-claro); }
.fp-foot .btn-primary { flex: 1; }
.cart-totals { display: grid; gap: 8px; margin: 20px 0 14px; padding-top: 14px; border-top: 1px solid var(--piedra-claro); }

/* Catálogo: renglones por marca con tamaños en pills; desktop = filtros con conteos · lista · resumen del pedido.
   Con texto en el buscador (html.has-q) se pliegan título, semana y chips: los resultados arrancan debajo del buscador. */
.announce { background: var(--tinta); color: var(--lino); font-size: 12px; font-weight: 500; letter-spacing: .02em; text-align: center; padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); }
.announce .dot { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: linear-gradient(176deg,#6b757c,#eef3f6,#fff,#aeb8be); vertical-align: middle; margin: 0 8px; }

.hdr { position: sticky; top: 0; z-index: 20; background: rgba(246,241,233,.94); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(20,17,14,.1); }
.hdr-in { max-width: 1320px; margin: 0 auto; padding: 6px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); display: grid; grid-template-columns: 1fr auto; grid-template-areas: "brand icons" "search search"; gap: 2px 4px; align-items: center; }
.hdr .wordmark { grid-area: brand; font-size: 15px; }
.hdr .search { grid-area: search; }
.hdr .icons { grid-area: icons; display: flex; }
.has-q .hdr .wordmark { display: none; }
.has-q .hdr .hdr-in { grid-template-areas: "search icons"; padding-top: 10px; }
.has-q .hdr #infoBtn { display: none; }
@media (min-width: 900px) {
  .hdr-in, .has-q .hdr .hdr-in { grid-template-columns: auto 1fr auto; grid-template-areas: "brand search icons"; gap: 28px; padding: 12px 32px; }
  .hdr .wordmark, .has-q .hdr .wordmark { display: block; font-size: 20px; letter-spacing: .2em; }
  .hdr .search { max-width: 600px; width: 100%; justify-self: center; }
  .has-q .hdr #infoBtn { display: inline-flex; }
}
.has-q .announce { display: none; }

.wrap { max-width: 1320px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
@media (min-width: 900px) { .wrap { padding-left: 32px; padding-right: 32px; } }
.intro { padding-block: 18px 0; display: grid; gap: 2px; }
.intro h1 { margin: 0; font-family: var(--f-serif); font-weight: 400; font-size: 27px; line-height: 1.1; text-wrap: balance; }
.intro p { margin: 0; color: var(--meta); font-size: 14px; }

/* Encargos de la semana (compacto) */
.week { margin-top: 14px; padding: 12px 14px; border-radius: 14px; background: var(--blanco); border: 1px solid var(--borde-card); display: grid; grid-template-columns: 22px 1fr; gap: 2px 10px; font-size: 13.5px; line-height: 1.45; }
.week > .ic { color: var(--vino); width: 20px; height: 20px; margin-top: 1px; }
.week b { font-weight: 700; }
.week .muted { color: var(--meta); grid-column: 2; }
.week .btn-link { min-height: 0; font-size: inherit; position: relative; }
.week .btn-link::after { content: ""; position: absolute; inset: -12px -6px; }
@media (min-width: 900px) { .week { grid-template-columns: 22px auto 1fr auto; align-items: center; gap: 12px; padding: 12px 18px; } .week .muted { grid-column: auto; } }

.toolbar { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 0 16px 0 max(16px, env(safe-area-inset-left, 0px)); }
.toolbar::-webkit-scrollbar { display: none; }
.toolbar { padding-top: 10px; }
.toolbar .sep { flex: none; width: 1px; background: var(--piedra); margin: 8px 2px; }
@media (min-width: 1024px) { .toolbar { display: none; } }
.has-q .intro, .has-q .week, .has-q .toolbar { display: none; }

.applied { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 10px; }
.applied:empty { display: none; }
.countbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0 0; font-size: 13.5px; color: var(--meta); }
/* En celular el orden está dentro de "Filtros" */
.countbar select { display: none; }
@media (min-width: 1024px) { .countbar select { display: block; } }
.countbar select { height: 44px; border: 1px solid var(--piedra); border-radius: 999px; background: var(--blanco); padding: 0 12px; font-size: 14px; color: var(--tinta); }

.layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; }
@media (min-width: 1024px) { .layout { grid-template-columns: 230px minmax(0, 1fr); align-items: start; padding-top: 20px; } }
@media (min-width: 1200px) { .layout { grid-template-columns: 230px minmax(0, 1fr) 300px; } }

/* Rail de filtros con conteos (desktop) */
.rail { display: none; }
@media (min-width: 1024px) {
  .rail { display: grid; gap: 22px; position: sticky; top: 90px; max-height: calc(100dvh - 110px); overflow-y: auto; padding-right: 6px; }
  .rail fieldset { border: 0; margin: 0; padding: 0; display: grid; gap: 2px; }
  .rail legend { padding-bottom: 6px; font-family: var(--f-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--vino); display: flex; align-items: center; gap: 8px; }
  .rail label.opt-r { display: grid; grid-template-columns: 20px 1fr auto; gap: 8px; align-items: center; min-height: 36px; font-size: 14px; cursor: pointer; border-radius: 8px; padding: 0 6px; }
  .rail label.opt-r:hover { background: rgba(20,17,14,.04); }
  .rail label.opt-r.zero { color: var(--meta); }

var PH_GROUPS;

function phPhoto(g) {
  if (!PH_GROUPS) {

}
function phHtml(g) {

<script>
/* Filtros compartidos: estado, rangos de precio, panel (hoja en mobile, diálogo en desktop) y chips de filtros aplicados. */
(function (global) {
  'use strict';
  var CF = global.CF, esc = CF.esc, icon = CF.icon, fmt = CF.fmt;

  var PRICE = [
    { id: 'p1', label: 'Hasta $ 80.000', max: 80000 },
    { id: 'p2', label: '$ 80.000 a $ 150.000', min: 80000, max: 150000 },
    { id: 'p3', label: '$ 150.000 a $ 300.000', min: 150000, max: 300000 },

  var SIZE = [{ id: 'small', label: 'Hasta 60 ml' }, { id: 'mid', label: '75 a 100 ml' }, { id: 'big', label: 'Más de 100 ml' }, { id: 'kit', label: 'Kits' }];

  function newState() { return { q: '', cat: '', brands: {}, price: '', min: 0, max: 0, gender: '', tester: '', size: '', sort: '' }; }

  }

    if (st.price) out.push({ k: 'price', label: PRICE.filter(function (x) { return x.id === st.price; })[0].label });
    else if (st.min || st.max) out.push({ k: 'price', label: (st.min ? 'Desde ' + fmt(st.min) : '') + (st.min && st.max ? ' ' : '') + (st.max ? 'hasta ' + fmt(st.max) : '') });

  function FilterPanel(opts) {
    var sections = opts.sections, getState = opts.getState, onApply = opts.onApply;
    var draft, brandQ = '';

  var DATA_KEY = 'catalogo-datos';

  function CartDrawer(opts) {
    var mode = opts.mode || 'two';
    var step = 'cart';
    var form = { name: '', province: '', delivery: '', payment: 'transferencia' };
    try { var saved = JSON.parse(CF.store(DATA_KEY) || '{}'); ['name', 'province', 'delivery', 'payment'].forEach(function (k) { if (saved[k]) form[k] = saved[k]; }); } catch (e) { }
    var touched = {};
    var clearArmed = null;

    var overlay = document.createElement('div');
    overlay.className = 'overlay'; overlay.hidden = true;
    var el = document.createElement('aside');
    el.className = 'drawer'; el.hidden = true;
    el.setAttribute('role', 'dialog'); el.setAttribute('aria-labelledby', 'cartTitle');
    document.body.appendChild(overlay); document.body.appendChild(el);
    overlay.addEventListener('click', close);

    function save() { CF.store(DATA_KEY, JSON.stringify(form)); }
    function valid() { return { name: form.name.trim().length >= 2, province: !!form.province, delivery: !!form.delivery }; }
    function deliveryOptions() {
      var o = ['sucursal', 'decant'];
      if (form.province === 'Córdoba') o.unshift('cordoba');
      return o;
    }

    function linesHtml() {
      return Cart.lines().map(function (l) {
        var it = l.item;
        return '<div class="cart-line" data-key="' + esc(it.key) + '">' +
          '<div><div class="brand">' + esc(it.brand) + '</div><div class="name">' + esc(it.display) + '</div>' +
          '<div class="spec">' + esc(CF.specText(it)) + '</div>' + CF.conditionLines(it) + '</div>' +
          '<div class="price">' + fmt(it.price * l.qty) + '</div>' +
          '<div class="row2"><div class="stepper" role="group" aria-label="Cantidad de ' + esc(it.display) + '">' +
          '<button type="button" data-act="dec" aria-label="Quitar uno de ' + esc(it.display) + '">' + icon('minus') + '</button>' +
          '<output aria-live="polite">' + l.qty + '</output>' +
          '<button type="button" data-act="inc" aria-label="Sumar uno de ' + esc(it.display) + '">' + icon('plus') + '</button></div>' +
          '<button type="button" class="icon-btn" data-act="rm" aria-label="Quitar ' + esc(it.display) + ' del pedido">' + icon('trash') + '</button></div></div>';
      }).join('');
    }

    function scheduleHtml() {
      var s = CF.schedule();
      return '<div class="cart-note">' + icon('calendar') + '<div><b>' + (s.lastDay ? 'Hoy es el último día' : 'Pedidos hasta el jueves ' + s.dm(s.thu)) + '</b> · cierra el viernes ' + s.dm(s.fri) +
        '.<br><span class="muted">Te llega entre el ' + s.dm(s.from) + ' y el ' + s.dm(s.to) + ' (7 a 10 días hábiles desde el cierre, puede ser antes).</span></div></div>';
    }

    function emptyHtml() {
      return '<div class="empty-cart">' + CF.seal(88) + '<p>Tu carrito está vacío.</p>' +
        '<a class="btn btn-primary" target="_blank" rel="noopener" href="' + CF.waHelp('¡Hola Agustín! No sé cuál elegir, ¿me ayudás?') + '">' + icon('whatsapp') + '¿No sabés cuál elegir? Escribime.</a>' +
        '<p class="muted" style="font-family:var(--f-sans);font-size:14px">¿Buscás algo que no está en la lista? También te lo consigo.</p></div>';
    }

    function fieldsHtml() {
      var v = valid();
      var provs = CF.PROVINCIAS.map(function (p) { return '<option' + (p === form.province ? ' selected' : '') + '>' + p + '</option>'; }).join('');
      var t = CF.totals(form);
      var del = deliveryOptions().map(function (k) {
        var d = CF.DELIVERY[k];
        var sub = k === 'decant' ? 'Sumá cualquier decant de <a href="https://crovatofragrances.com" target="_blank" rel="noopener">crovatofragrances.com</a> y el envío no se cobra' : k === 'cordoba' ? 'Te lo doy el mismo día que llega' : 'A cualquier punto del país';
        return '<label class="opt"><input type="radio" name="cf-delivery" value="' + k + '"' + (form.delivery === k ? ' checked' : '') + '><span>' + d.short + '<small>' + sub + '</small></span><b>' + (d.cost ? fmt(d.cost) : 'Gratis') + '</b></label>';
      }).join('');
      var pay = '<label class="opt"><input type="radio" name="cf-payment" value="transferencia"' + (form.payment === 'transferencia' ? ' checked' : '') + '><span>Transferencia<small>Precio publicado</small></span><b>' + fmt(t.base) + '</b></label>' +
        t.card.map(function (c) {
          return '<label class="opt"><input type="radio" name="cf-payment" value="tarjeta' + c.n + '"' + (form.payment === 'tarjeta' + c.n ? ' checked' : '') + '><span>Tarjeta, ' + c.n + (c.n === 1 ? ' pago' : ' cuotas') + '<small>Link de pago · +' + c.pct + ' %' + (c.n > 1 ? ' · ' + c.n + ' de ' + fmt(c.cuota) : '') + '</small></span><b>' + fmt(c.total) + '</b></label>';
        }).join('');
      return '<div class="checkout">' +
        '<div class="field' + (touched.name && !v.name ? ' invalid' : '') + '"><label for="cfName">Tu nombre</label><input id="cfName" autocomplete="given-name" value="' + esc(form.name) + '" placeholder="Para saber quién encarga">' + (touched.name && !v.name ? '<span class="err">Escribí tu nombre.</span>' : '') + '</div>' +
        '<div class="field' + (touched.province && !v.province ? ' invalid' : '') + '"><label for="cfProv">Provincia</label><select id="cfProv"><option value="">Elegí tu provincia</option>' + provs + '</select>' + (touched.province && !v.province ? '<span class="err">Elegí la provincia para calcular la entrega.</span>' : '') + '</div>' +
        '<div class="field"><span class="label" id="lblDel">Entrega</span><div class="opts" role="radiogroup" aria-labelledby="lblDel">' + del + '</div>' + (touched.delivery && !v.delivery ? '<span class="err">Elegí cómo te lo entrego.</span>' : '') + '</div>' +
        '<div class="field"><span class="label" id="lblPay">Pago (el pedido se abona completo al encargarlo)</span><div class="opts" role="radiogroup" aria-labelledby="lblPay">' + pay + '</div></div>' +
        '</div>';
    }

    function totalsHtml() {
      var t = CF.totals(form);
      return '<div class="sum-row"><span>Productos</span><span class="tnum">' + fmt(t.subtotal) + '</span></div>' +
        '<div class="sum-row"><span>Entrega</span><span class="tnum">' + (form.delivery ? (t.envio ? fmt(t.envio) : 'Gratis') : '<span class="muted">' + fmt(CF.ENVIO_SUCURSAL) + ' a sucursal · gratis con decant</span>') + '</span></div>' +
        (t.cuotas ? '<div class="sum-row"><span>Recargo tarjeta</span><span class="tnum">' + fmt(t.total - t.base) + '</span></div>' : '') +
        '<div class="sum-row total"><span>Total</span><span class="tnum">' + fmt(t.total) + '</span></div>' +
        (t.cuotas > 1 ? '<div class="sum-row"><span class="muted">' + t.cuotas + ' cuotas de</span><span class="tnum">' + fmt(t.cuota) + '</span></div>' : '');
    }

    function messagePreview() {
      var url = CF.whatsappUrl(form);
      return decodeURIComponent(url.split('?text=')[1]);
    }

    function render() {
      var n = Cart.count();
      var title = step === 'datos' ? 'Tus datos' : step === 'revisar' ? 'Revisá el mensaje' : 'Tu pedido <span class="n">(' + n + ')</span>';
      var back = step !== 'cart' ? '<button type="button" class="icon-btn" data-act="back" aria-label="Volver">' + '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>' + '</button>' : '';
      var stepsBar = mode !== 'one' && n ? '<ol class="steps" aria-label="Pasos">' + (mode === 'three' ? ['cart', 'datos', 'revisar'] : ['cart', 'datos']).map(function (s, i) {
        var lbl = { cart: 'Pedido', datos: 'Datos', revisar: 'Mensaje' }[s];
        return '<li' + (s === step ? ' aria-current="step"' : '') + '><span>' + (i + 1) + '</span>' + lbl + '</li>';
      }).join('') + '</ol>' : '';
      var body = '', foot = '';
      var v = valid(), ok = v.name && v.province && v.delivery;
      if (!n) {
        body = emptyHtml();
      } else if (step === 'cart') {
        body = scheduleHtml() + linesHtml() + (mode === 'one' ? '<h3 class="cart-sub">Tus datos para el pedido</h3>' + fieldsHtml() : '') +
          '<div class="clear-row"><button type="button" class="btn-link" data-act="clear">' + (clearArmed ? '¿Seguro? Tocá de nuevo para vaciar' : 'Vaciar carrito') + '</button></div>';
        var trust = '<div class="trust">' + CF.seal(36) + '<span>Lo reviso yo antes de enviarlo. Si algo no está bien, te devuelvo el dinero.</span></div>';
        if (mode === 'one') body += '<div class="cart-totals">' + totalsHtml() + '</div>' + trust;
        foot = (mode === 'one' ? '<div class="sum-row total"><span>Total</span><span class="tnum">' + fmt(CF.totals(form).total) + '</span></div>' : totalsHtml() + trust) +
          (mode === 'one' ? waBtn(ok) : '<button type="button" class="btn btn-primary btn-block" data-act="next" data-autofocus>Continuar con el pedido' + icon('arrow') + '</button>');
      } else if (step === 'datos') {
        body = fieldsHtml() + (opts.preview ? '<div class="cart-totals">' + totalsHtml() + '</div><h3 class="cart-sub">Así me llega por WhatsApp</h3><p class="muted" style="margin:0 0 8px;font-size:13.5px">Lo podés editar en el chat antes de mandarlo.</p><pre class="letter" id="cfPreview">' + esc(messagePreview()) + '</pre>' : '');
        foot = (opts.preview ? '<div class="sum-row total"><span>Total</span><span class="tnum">' + fmt(CF.totals(form).total) + '</span></div>' : totalsHtml()) + (mode === 'three' ? '<button type="button" class="btn btn-primary btn-block" data-act="next">Ver el mensaje' + icon('arrow') + '</button>' : waBtn(ok));
      } else {
        body = '<p class="muted" style="margin:12px 0 8px">Esto es lo que me llega por WhatsApp. Lo podés editar en el chat antes de mandarlo.</p><pre class="letter">' + esc(messagePreview()) + '</pre>';
        foot = waBtn(ok);
      }
      el.innerHTML = '<div class="drawer-head">' + back + '<h2 id="cartTitle">' + title + '</h2><button type="button" class="icon-btn" data-act="close" aria-label="Cerrar el carrito">' + icon('close') + '</button></div>' +
        stepsBar + '<div class="drawer-body">' + body + '</div>' + (foot ? '<div class="drawer-foot">' + foot + '</div>' : '');
    }
    function waBtn(ok) {
      return '<a class="btn btn-wa btn-block" data-act="wa" target="_blank" rel="noopener" href="' + CF.whatsappUrl(form) + '">' + icon('whatsapp') + 'Enviar pedido por WhatsApp</a>' +
        '<p class="wa-note">Se abre WhatsApp con el pedido escrito. Ahí te confirmo el total y te paso los datos para pagar.</p>';
    }

    function rerender(focusSel) {
      var y = el.querySelector('.drawer-body') ? el.querySelector('.drawer-body').scrollTop : 0;
      render();
      var b = el.querySelector('.drawer-body'); if (b) b.scrollTop = y;
      if (focusSel) { var f = el.querySelector(focusSel); if (f) f.focus({ preventScroll: true }); }
    }

    el.addEventListener('click', function (e) {
      var b = e.target.closest('[data-act]');
      if (!b) return;
      var act = b.getAttribute('data-act');
      var line = b.closest('[data-key]'), key = line && line.getAttribute('data-key');
      if (act === 'close') return close();
      if (act === 'inc') { Cart.add(key); return; }
      if (act === 'dec') { Cart.dec(key); return; }
      if (act === 'rm') { Cart.remove(key); CF.announce('Quitado del pedido'); return; }
      if (act === 'clear') {
        if (clearArmed) { clearTimeout(clearArmed); clearArmed = null; Cart.clear(); return; }
        clearArmed = setTimeout(function () { clearArmed = null; rerender(); }, 4000); rerender('[data-act="clear"]'); return;
      }
      if (act === 'back') { step = step === 'revisar' ? 'datos' : 'cart'; rerender('[data-act="close"]'); return; }
      if (act === 'next') {
        if (step === 'cart') { step = 'datos'; rerender('#cfName'); return; }
        if (step === 'datos') {
          var v = valid();
          if (!(v.name && v.province && v.delivery)) { touched = { name: 1, province: 1, delivery: 1 }; rerender(!v.name ? '#cfName' : !v.province ? '#cfProv' : 'input[name="cf-delivery"]'); return; }
          step = 'revisar'; rerender('[data-act="wa"]'); return;
        }
      }
      if (act === 'wa') {
        var v2 = valid();
        if (!(v2.name && v2.province && v2.delivery)) {
          e.preventDefault(); touched = { name: 1, province: 1, delivery: 1 };
          if (mode === 'three' && step === 'revisar') step = 'datos';
          rerender(!v2.name ? '#cfName' : !v2.province ? '#cfProv' : 'input[name="cf-delivery"]');
          CF.announce('Faltan datos para armar el pedido');
        }
      }
    });
    el.addEventListener('input', function (e) {
      if (e.target.id === 'cfName') { form.name = e.target.value; save(); refreshTotals(); }
    });
    el.addEventListener('focusout', function (e) {
      if (e.target.id === 'cfName' && !touched.name) { touched.name = 1; if (!valid().name) rerender(); }
    });
    el.addEventListener('change', function (e) {
      var t = e.target;
      if (t.id === 'cfProv') { form.province = t.value; touched.province = 1; if (form.delivery === 'cordoba' && t.value !== 'Córdoba') form.delivery = ''; if (t.value === 'Córdoba' && !form.delivery) form.delivery = 'cordoba'; save(); rerender('#cfProv'); }
      if (t.name === 'cf-delivery') { form.delivery = t.value; save(); rerender('input[name="cf-delivery"][value="' + t.value + '"]'); }
      if (t.name === 'cf-payment') { form.payment = t.value; save(); rerender('input[name="cf-payment"][value="' + t.value + '"]'); }
    });
    // Mientras se escribe el nombre no se redibuja el panel (perdería el foco): solo el link de WhatsApp y el total
    function refreshTotals() {
      var a = el.querySelector('[data-act="wa"]'); if (a) a.href = CF.whatsappUrl(form);
      var pv = el.querySelector('#cfPreview'); if (pv) pv.textContent = messagePreview();
    }

    Cart.onChange(function () { if (!el.hidden) { if (!Cart.count()) step = 'cart'; rerender(); } });

    function openDrawer(opener) {
      render();
      overlay.hidden = false;
      CF.openModal(el, opener, { onClose: function () { overlay.hidden = true; } });
    }
    function close() { CF.closeModal(el); }
    this.open = openDrawer;
    this.close = close;
    this.form = form;
  }
  global.CartDrawer = CartDrawer;
})(window);
</script>
<script>
(function () {
  'use strict';
  var CF = window.CF, F = window.Filters, Cart = CF.Cart, esc = CF.esc, fmt = CF.fmt, icon = CF.icon;
  var PAGE = 50;
  var st = F.newState(), shown = PAGE, groups = [], sel = {}, brandQ = '', lastQ = '', brandIndex = [];
  var $ = function (id) { return document.getElementById(id); };
  var root = document.documentElement;
  var drawer = new CartDrawer({ mode: 'two', preview: true });
  var panel = new F.FilterPanel({ sections: ['price', 'sort', 'size', 'tester', 'brand'], priceSortsAsc: true, getState: function () { return st; }, onApply: function (d) { st = d; shown = PAGE; run(); } });
  var sch = CF.schedule();
  var CATS = [['', 'Todas'], ['disenador', 'Diseñador'], ['arabe', 'Árabe'], ['nicho', 'Nicho']];
  var REASSURE = [
    ['shield', 'Perfumes originales. Los reviso yo antes de enviarlos y, si algo no está bien, te devuelvo el dinero.'],
    ['calendar', 'Pedidos de sábado a jueves; cierran el viernes ' + sch.dm(sch.fri) + '. Llegan en 7 a 10 días hábiles desde el cierre, a veces antes.'],
    ['card', 'Se abona completo al encargar: transferencia al precio publicado, o tarjeta con link de pago en 1, 2 o 3 cuotas (+9, 18 o 27 %).'],
    ['truck', 'Envío a sucursal de Correo Argentino por ' + fmt(CF.ENVIO_SUCURSAL) + ', gratis sumando un decant de crovatofragrances.com. En Córdoba, en mano el día que llega.'],
    ['whatsapp', '¿No está en la lista? Consultame por WhatsApp: muchas veces lo consigo igual.']
  ];

  // Textos fijos
  $('announce').innerHTML = (sch.lastDay ? 'Hoy cierran los pedidos de la semana' : 'Pedidos hasta el jueves ' + sch.dm(sch.thu)) + '<span class="dot"></span>Llegan del ' + sch.dm(sch.from) + ' al ' + sch.dm(sch.to);
  $('week').innerHTML = icon('calendar') + '<div><b>Encargos de la semana:</b> ' + (sch.lastDay ? 'hoy es el último día' : 'hasta el jueves ' + sch.dm(sch.thu)) + ', cierra el viernes ' + sch.dm(sch.fri) + '.</div>' +
    '<div class="muted">Se abona al encargar · envío ' + fmt(CF.ENVIO_SUCURSAL) + ' o gratis con un decant · Córdoba en mano · <button type="button" class="btn-link" data-act="info">Cómo encargar</button></div>';
  $('introMeta').textContent = 'Precios del ' + CF.date.slice(0, 5) + ', por transferencia.';
  $('infoBtn').innerHTML = icon('info');
  $('cartIc').innerHTML = icon('bag');
  $('qClear').innerHTML = icon('close');
  $('footWa').innerHTML = icon('whatsapp') + 'Escribime por WhatsApp';
  $('footWa').href = CF.waHelp('¡Hola Agustín! Tengo una consulta sobre la lista de encargos.');
  $('decant').innerHTML = CF.seal(56) + '<div><b>Sumá un decant y el envío es gratis</b><span>Cualquier tamaño, en crovatofragrances.com</span></div>';

  // ⓘ Cómo encargar
  var info = document.createElement('div');
  info.className = 'sheet'; info.hidden = true; info.setAttribute('role', 'dialog'); info.setAttribute('aria-labelledby', 'infoT');
  info.innerHTML = '<div class="sheet-card"><div class="sheet-grip" aria-hidden="true"></div><p class="eyebrow">Cómo encargar</p><h2 id="infoT" class="sheet-title">Armá el pedido acá y mandámelo por WhatsApp</h2><ul class="info-list">' +
    REASSURE.map(function (r) { return '<li>' + icon(r[0]) + '<span>' + r[1] + '</span></li>'; }).join('') +
    '</ul><div class="sheet-actions"><button type="button" class="btn btn-primary" data-close data-autofocus>Entendido</button></div></div>';
  document.body.appendChild(info);
  info.addEventListener('click', function (e) { if (e.target === info || e.target.closest('[data-close]')) CF.closeModal(info); });
  function openInfo(opener) { CF.openModal(info, opener, { lock: false }); }
  $('infoBtn').addEventListener('click', function () { openInfo(this); });

  function n(x) { return (x || 0).toLocaleString('es-AR'); }

  function chips(fc) {
    var nf = F.count(st);
    $('toolbar').innerHTML = '<button type="button" class="chip" data-act="filters">' + icon('filter') + 'Filtros' + (nf ? ' <span class="n">' + nf + '</span>' : '') + '</button><span class="sep" aria-hidden="true"></span>' +
      CATS.map(function (c) { return '<button type="button" class="chip" data-cat="' + c[0] + '" aria-pressed="' + (st.cat === c[0]) + '">' + c[1] + '<span class="n">' + n(c[0] ? fc.cat[c[0]] : fc.cat['*']) + '</span></button>'; }).join('') +
      '<button type="button" class="chip" data-act="testers" aria-pressed="' + (st.tester === 'only') + '">Solo testers<span class="n">' + n(fc.tester.only) + '</span></button>';
    $('applied').innerHTML = F.appliedHtml(st);
    $('sort').value = st.sort;
    $('sortDefault').textContent = st.q.trim() ? 'Relevancia' : 'A–Z por marca';
  }

  function rail(fc) {
    function radios(name, items, val, counts) {
      return items.map(function (x) {
        var c = counts ? (x.id ? counts[x.id] : counts['*']) : null;
        return '<label class="opt-r' + (counts && !c && val !== x.id ? ' zero' : '') + '"><input type="radio" name="r-' + name + '" value="' + x.id + '"' + (val === x.id ? ' checked' : '') + '><span>' + x.label + '</span><span class="n">' + (c != null ? n(c) : '') + '</span></label>';
      }).join('');
    }
    var bq = CF.fold(brandQ);
    var brands = Object.keys(fc.brand).filter(function (b) { return b !== '*'; }).sort(function (a, b) { return a.localeCompare(b, 'es'); }).filter(function (b) { return !bq || CF.fold(b).indexOf(bq) >= 0; });
    Object.keys(st.brands).forEach(function (b) { if (brands.indexOf(b) < 0) brands.unshift(b); });
    $('rail').innerHTML =
      '<fieldset><legend>Presupuesto</legend>' + radios('price', [{ id: '', label: 'Cualquiera' }].concat(F.PRICE), st.price, fc.price) + '</fieldset>' +
      '<fieldset><legend>Categoría</legend>' + radios('cat', CATS.map(function (c) { return { id: c[0], label: c[1] }; }), st.cat, fc.cat) + '</fieldset>' +
      '<fieldset><legend>Tamaño</legend>' + radios('size', [{ id: '', label: 'Todos' }].concat(F.SIZE), st.size, fc.size) + '</fieldset>' +
      '<fieldset><legend>Testers <button type="button" class="tag tag-btn" data-explain="tester" aria-label="Tester: ver qué significa">¿Qué es?</button></legend>' + radios('tester', F.TESTER, st.tester, fc.tester) + '</fieldset>' +
      '<fieldset><legend>Marca</legend><div class="search">' + icon('search') + '<input type="search" id="railBrandQ" placeholder="Buscar marca" value="' + esc(brandQ) + '" autocomplete="off" aria-label="Buscar marca"></div><div class="brands" id="railBrands">' +
      (brands.map(function (b) { return '<label class="opt-r"><input type="checkbox" value="' + esc(b) + '"' + (st.brands[b] ? ' checked' : '') + '><span>' + esc(b) + '</span><span class="n">' + n(fc.brand[b]) + '</span></label>'; }).join('') || '<p class="muted" style="margin:8px">No hay marcas con ese nombre.</p>') + '</div></fieldset>';
  }

  function cur(g) { return g.sizes[Math.min(sel[g.key] || 0, g.sizes.length - 1)]; }
  function buyCtl(it) {
    var q = Cart.qty(it.key);
    if (!q) return '<button type="button" class="add" data-act="add" aria-label="Agregar ' + esc(it.display + (it.ml ? ' ' + it.ml + ' ml' : '')) + ' al pedido">Agregar</button>';
    return '<div class="stepper" role="group" aria-label="Cantidad de ' + esc(it.display) + '"><button type="button" data-act="dec" aria-label="Quitar uno">' + icon('minus') + '</button><output>' + q + '</output><button type="button" data-act="inc" aria-label="Sumar uno">' + icon('plus') + '</button></div>';
  }
  function rowHtml(g) {
    var it = cur(g);
    var multi = g.sizes.length > 1;
    // Con varios tamaños, los tags de tamaño van donde iría "· 100 ML"; el precio y "Agregar" siguen al elegido
    var spec = [it.conc, !multi && it.ml ? it.ml + ' ml' : '', it.kit ? 'Kit' : ''].filter(Boolean).join(' · ');
    return '<div class="row" data-g="' + esc(g.key) + '" data-key="' + esc(it.key) + '">' + phHtml(g) + '<div class="ph-info"><div class="br">' + esc(it.brand) + '</div><div class="nm">' + esc(it.display) + '</div>' +
      '<div class="meta">' + (spec ? '<span class="spec">' + esc(spec) + '</span>' : '') +
      (multi ? '<span class="sizes" role="group" aria-label="Tamaño de ' + esc(it.display) + '">' + g.sizes.map(function (s, i) { return '<button type="button" class="sz" data-size="' + i + '" aria-pressed="' + (s === it) + '">' + s.ml + ' ml</button>'; }).join('') + '</span>' : '') +
      CF.conditionChips(it) + '</div></div>' +
      '<div class="buy"><div class="pr">' + fmt(it.price) + phInstallments(it.price) + '</div>' + buyCtl(it) + '</div></div>';
  }

  function run() {
    var r = CF.query(st);
    groups = CF.group(r.items);
    var fc = CF.facets(st);
    chips(fc); rail(fc);

    $('countTxt').textContent = n(groups.length) + (groups.length === 1 ? ' perfume' : ' perfumes');
    $('corrected').innerHTML = r.corrected ? '<p class="corrected">No encontré "' + esc(st.q) + '". Te muestro resultados para <b>' + esc(r.corrected) + '</b>.</p>' : '';
    if (st.q !== lastQ) { lastQ = st.q; if (st.q.trim()) window.scrollTo(0, 0); }
    paint();
  }
  function paint() {
    var flat = !!st.sort || !!st.q.trim();
    if (!groups.length) {
      $('results').innerHTML = '<div class="no-results"><h3>No lo encontré en la lista.</h3><p>Probá con menos palabras o sacá algún filtro. Si no está, muchas veces lo consigo igual.</p><div style="display:flex;gap:10px;flex-wrap:wrap">' +
        (F.count(st) || st.cat ? '<button type="button" class="btn btn-outline" data-act="reset">Sacar los filtros</button>' : '') +
        '<a class="btn btn-wa" target="_blank" rel="noopener" href="' + CF.waHelp('¡Hola Agustín! Busco "' + st.q + '" y no lo encontré en la lista. ¿Lo conseguís?') + '">' + icon('whatsapp') + 'Consultame por WhatsApp</a></div></div>';
      $('more').innerHTML = ''; return;
    }
    $('results').className = flat ? 'flat' : '';
    var h = '', last = null, perBrand = {};
    brandIndex = [];
    if (!flat) groups.forEach(function (g, i) {
      if (!perBrand[g.head.brand]) { perBrand[g.head.brand] = 0; brandIndex.push({ brand: g.head.brand, first: i }); }
      perBrand[g.head.brand]++;
    });
    brandIndex.forEach(function (b) { b.count = perBrand[b.brand]; });
    groups.slice(0, shown).forEach(function (g) {
      if (!flat && g.head.brand !== last) {
        if (last !== null) h += '</section>';
        var b = esc(g.head.brand), c = perBrand[g.head.brand];
        // Alto estimado de la sección (renglón ≈ 100 px) para content-visibility: así el salto cae cerca
        h += '<section class="brand-sec" data-brand="' + b + '" style="contain-intrinsic-height:auto ' + (c * 100 + 48) + 'px"><h2 class="brand-h"><button type="button" data-act="brands" aria-haspopup="dialog" aria-label="' + b + ', ' + c + (c === 1 ? ' perfume' : ' perfumes') + '. Ver la lista de marcas">' +
          '<span class="bn">' + b + '</span><span class="n">' + c + '</span>' + icon('chevron', 'chev') + '</button></h2>';
        last = g.head.brand;
      }
      h += rowHtml(g);
    });
    if (!flat && last !== null) h += '</section>';
    $('results').innerHTML = h;
    var left = groups.length - shown;
    $('more').innerHTML = left > 0 ? '<button type="button" class="btn btn-outline" data-act="more">Mostrar ' + Math.min(PAGE, left) + ' más</button><p>Viendo ' + shown + ' de ' + n(groups.length) + '</p>' : '';
  }
  function updateRow(row) {
    var g = groups.filter(function (x) { return x.key === row.getAttribute('data-g'); })[0];
    if (!g) return null;
    var had = row.contains(document.activeElement) && document.activeElement.getAttribute('data-act');
    var t = document.createElement('div'); t.innerHTML = rowHtml(g);
    row.replaceWith(t.firstChild);
    var nr = document.querySelector('.row[data-g="' + CSS.escape(g.key) + '"]');
    if (had && nr) { var f = nr.querySelector('[data-act="inc"]') || nr.querySelector('[data-act="add"]'); if (f) f.focus(); }
    return nr;
  }
  function side() {
    var lines = Cart.lines();
    $('side').innerHTML = '<p class="eyebrow">Tu pedido</p>' + (lines.length ?
      '<div class="lines">' + lines.map(function (l) { return '<div class="ln"><span>' + l.qty + '× ' + esc(l.item.display + ' ' + CF.specText(l.item)) + '</span><span class="tnum">' + fmt(l.item.price * l.qty) + '</span></div>'; }).join('') + '</div>' +
      '<div class="sum-row total"><span>Productos</span><span class="tnum">' + fmt(Cart.subtotal()) + '</span></div>' +
      '<p class="muted" style="margin:0;font-size:13px">Envío a sucursal ' + fmt(CF.ENVIO_SUCURSAL) + ' (gratis sumando un decant). Cierra el viernes ' + sch.dm(sch.fri) + '.</p>' +
      '<button type="button" class="btn btn-primary btn-block" data-act="open-cart">Continuar con el pedido' + icon('arrow') + '</button>'
      : '<p class="empty">Todavía no agregaste nada. Lo que sumes queda acá, aunque cierres la página.</p>' +
      '<a class="btn-link" target="_blank" rel="noopener" href="' + CF.waHelp('¡Hola Agustín! No sé cuál elegir, ¿me ayudás?') + '">¿No sabés cuál elegir? Escribime.</a>') +
      '<div class="trust" style="font-size:15px">' + CF.seal(32) + '<span>Lo reviso yo antes de enviarlo.</span></div>';
  }
  function cartUi(key, action) {
    var c = Cart.count(), b = $('badge');
    b.hidden = !c; b.textContent = c;
    if (action === 'add') { b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop'); }
    $('cartBtn').setAttribute('aria-label', c ? 'Abrir el pedido, ' + c + (c === 1 ? ' producto' : ' productos') : 'Abrir el pedido');
    $('buybar').hidden = !c; document.body.classList.toggle('has-bar', !!c);
    $('buybarBtn').innerHTML = '<span>Ver pedido · ' + c + '</span><span class="tnum">' + fmt(Cart.subtotal()) + '</span>';
    side();
    if (key) { var r = document.querySelector('.row[data-key="' + CSS.escape(key) + '"]'); if (r) { var nr = updateRow(r); if (action === 'add' && nr) nr.querySelector('.buy').classList.add('added-flash'); } }
    else if (action) paint();
  }
  Cart.onChange(cartUi);

  function setPrice(p) { st.price = p; st.min = st.max = 0; F.applyPrice(st); if (p && !st.sort) st.sort = 'asc'; }
  document.addEventListener('click', function (e) {
    var ex = e.target.closest('[data-explain]');
    if (ex) { e.preventDefault(); CF.explain(ex.getAttribute('data-explain'), ex, function () { st.tester = 'only'; shown = PAGE; run(); }); return; }
    if (e.target.closest('.drawer') || e.target.closest('.sheet')) return;
    var c = e.target.closest('[data-cat]');
    if (c && c.closest('#toolbar')) { st.cat = c.getAttribute('data-cat'); shown = PAGE; run(); return; }
    var u = e.target.closest('[data-unfilter]');
    if (u) { F.removeFilter(st, u.getAttribute('data-unfilter'), u.getAttribute('data-v')); shown = PAGE; run(); return; }
    var sz = e.target.closest('[data-size]');
    if (sz) { var row = sz.closest('.row'); sel[row.getAttribute('data-g')] = +sz.getAttribute('data-size'); var nr = updateRow(row); nr.querySelector('[data-size="' + sz.getAttribute('data-size') + '"]').focus(); return; }
    var b = e.target.closest('[data-act]');
    if (!b) return;
    var act = b.getAttribute('data-act'), rw = b.closest('.row'), key = rw && rw.getAttribute('data-key');
    if (act === 'add' || act === 'inc') { Cart.add(key); if (act === 'add') CF.announce(CF.BY_KEY[key].display + ' agregado al pedido'); }
    if (act === 'dec') Cart.dec(key);
    if (act === 'more') { shown += PAGE; paint(); var rows = document.querySelectorAll('.row'); if (rows[shown - PAGE]) rows[shown - PAGE].querySelector('button:not(.tag-btn)').focus({ preventScroll: true }); }
    if (act === 'filters') panel.open(b);
    if (act === 'testers') { st.tester = st.tester === 'only' ? '' : 'only'; shown = PAGE; run(); }
    if (act === 'reset') { var q = st.q; st = F.newState(); st.q = q; shown = PAGE; run(); }
    if (act === 'open-cart') drawer.open(b);
    if (act === 'info') openInfo(b);
    if (act === 'brands') openBrands(b);
  });
  $('rail').addEventListener('change', function (e) {
    var t = e.target;
    if (t.name && t.name.indexOf('r-') === 0) {
      var k = t.name.slice(2);
      if (k === 'price') setPrice(t.value); else st[k] = t.value;
    } else if (t.type === 'checkbox') { if (t.checked) st.brands[t.value] = 1; else delete st.brands[t.value]; }
    var y = $('rail').scrollTop, by = $('railBrands') ? $('railBrands').scrollTop : 0;
    var sel2 = t.name ? 'input[name="' + t.name + '"][value="' + t.value + '"]' : 'input[type=checkbox][value="' + CSS.escape(t.value) + '"]';
    shown = PAGE; run();
    $('rail').scrollTop = y; if ($('railBrands')) $('railBrands').scrollTop = by;
    var f = $('rail').querySelector(sel2); if (f) f.focus({ preventScroll: true });
  });
  $('rail').addEventListener('input', function (e) {
    if (e.target.id !== 'railBrandQ') return;
    brandQ = e.target.value; rail(CF.facets(st));
    var i = $('railBrandQ'); i.focus(); i.setSelectionRange(i.value.length, i.value.length);
  });
  $('cartBtn').addEventListener('click', function () { drawer.open(this); });
  $('buybarBtn').addEventListener('click', function () { drawer.open(this); });
  $('sort').addEventListener('change', function () { st.sort = this.value; shown = PAGE; run(); });

  // Buscador: el plegado (has-q) se aplica en el acto, sin esperar el debounce, para que el teclado nunca tape los resultados
  var tmr;
  function onQuery(v) {
    root.classList.toggle('has-q', !!v.trim());
    setHdrH();
    $('qClear').hidden = !v;
    clearTimeout(tmr);
    tmr = setTimeout(function () { st.q = v; shown = PAGE; run(); }, 120);
  }
  $('q').addEventListener('input', function () { onQuery(this.value); });
  $('qClear').addEventListener('click', function () { $('q').value = ''; onQuery(''); $('q').focus(); });

  // ── Lista de marcas (navegación, no filtro): salta a la marca elegida y se puede seguir bajando ──
  var brandSheet = document.createElement('div');
  brandSheet.className = 'sheet brand-sheet'; brandSheet.hidden = true;
  brandSheet.setAttribute('role', 'dialog'); brandSheet.setAttribute('aria-labelledby', 'brandsT');
  document.body.appendChild(brandSheet);
  var brandCur = '', brandFilter = '';
  function brandItems() {
    var f = CF.fold(brandFilter);
    var list = brandIndex.filter(function (b) { return !f || CF.fold(b.brand).indexOf(f) >= 0; });
    return list.map(function (b) {
      return '<li><button type="button" data-goto="' + esc(b.brand) + '"' + (b.brand === brandCur ? ' aria-current="true" data-autofocus' : '') + '>' + esc(b.brand) + '<span class="n">' + b.count + '</span></button></li>';
    }).join('') || '<li class="muted" style="padding:12px 4px">No hay marcas con ese nombre.</li>';
  }
  function openBrands(btn) {
    brandCur = btn.closest('.brand-sec').getAttribute('data-brand');
    brandFilter = '';
    brandSheet.innerHTML = '<div class="sheet-card"><div class="sheet-grip" aria-hidden="true"></div><div class="fp-head"><h2 id="brandsT" class="sheet-title">Marcas <span class="muted" style="font-family:var(--f-mono);font-size:12px">' + brandIndex.length + '</span></h2>' +
      '<button type="button" class="icon-btn" data-close aria-label="Cerrar la lista de marcas">' + icon('close') + '</button></div>' +
      '<div class="search">' + icon('search') + '<input type="search" id="brandsQ" placeholder="Buscar marca" autocomplete="off" aria-label="Buscar marca"></div>' +
      '<ul class="brand-list" id="brandsL">' + brandItems() + '</ul></div>';
    var r = btn.getBoundingClientRect();
    brandSheet.style.setProperty('--pop-top', Math.round(r.bottom + 6) + 'px');
    brandSheet.style.setProperty('--pop-left', Math.round(r.left) + 'px');
    CF.openModal(brandSheet, btn);
    var curEl = brandSheet.querySelector('[aria-current="true"]');
    if (curEl) curEl.scrollIntoView({ block: 'center' });
  }
  function gotoBrand(brand) {
    var b = brandIndex.filter(function (x) { return x.brand === brand; })[0];
    if (!b) return;
    // Se dibuja hasta esa marca (y una tanda más) antes de saltar
    if (b.first + PAGE > shown) { shown = b.first + PAGE; paint(); }
    var sec = document.querySelector('.brand-sec[data-brand="' + CSS.escape(brand) + '"]');
    if (!sec) return;
    // Se alinea debajo de la parte visible del header, sin cambiar su alto:
    // las secciones que se arman al pasar cambian su alto estimado por el real: se corrige hasta que la marca
    // queda quieta 3 cuadros seguidos (máx. 40)
    setHdrH();
    var frames = 0, still = 0;
    (function align() {
      var off = sec.getBoundingClientRect().top - parseFloat(getComputedStyle(sec.querySelector('.brand-h')).top);
      if (Math.abs(off) > 1) { window.scrollBy(0, off); still = 0; } else still++;
      if (still < 3 && frames++ < 40) requestAnimationFrame(align);
    })();
    // El foco va al encabezado de la marca elegida; el anillo solo se ve si se navega con teclado
    CF.focusEl(sec.querySelector('.brand-h button'));
  }
  brandSheet.addEventListener('click', function (e) {
    if (e.target === brandSheet || e.target.closest('[data-close]')) return CF.closeModal(brandSheet);
    var go = e.target.closest('[data-goto]');
    if (go) { var brand = go.getAttribute('data-goto'); CF.closeModal(brandSheet); gotoBrand(brand); }
  });
  brandSheet.addEventListener('input', function (e) {
    if (e.target.id !== 'brandsQ') return;
    brandFilter = e.target.value; $('brandsL').innerHTML = brandItems();
  });

  // Measure layout only; scrolling is handled by CSS sticky positioning.
  function setHdrH() {
    var hdr = $('hdr'), search = hdr.querySelector('.search');
    var height = hdr.getBoundingClientRect().height;
    var off = window.matchMedia('(max-width: 1023px)').matches ?
      Math.max(0, search.getBoundingClientRect().top - hdr.getBoundingClientRect().top - 10) : 0;
    root.style.setProperty('--hdr-off', off + 'px');
    root.style.setProperty('--hdr-vis', (height - off) + 'px');
    root.style.setProperty('--hdr-h', height + 'px');
  }
  if (window.ResizeObserver) {
    var hdrObserver = new ResizeObserver(setHdrH);
    hdrObserver.observe($('hdr'));
    hdrObserver.observe($('hdr').querySelector('.search'));
  }
  window.addEventListener('resize', setHdrH);
  setHdrH();

  CF.watchKeyboard();
  run(); cartUi();
})();
</script>
<div id="ph-zoom" hidden role="dialog" aria-labelledby="ph-title"><figure><div class="ph-zoom-head"><h2 id="ph-title"></h2><button id="ph-close" type="button" class="btn btn-outline" data-autofocus>Cerrar</button></div><img alt="" referrerpolicy="no-referrer"><p id="ph-error" hidden>No se pudo cargar la foto.</p></figure></div>
</body>
</html>
